<div class="flex flex-col min-h-screen bg-gray-950 text-white px-6 py-10 pb-32 gap-10">

  <!-- Score selector -->
  <section class="flex flex-col items-center gap-3 w-full">
    <h2 class="text-sm uppercase tracking-widest text-gray-400">Target Score</h2>
    <bm-slider
      [options]="scoreOptions"
      [value]="targetScore()"
      (valueChange)="targetScore.set($event)"
    />
  </section>

  <!-- Team count selector -->
  <section class="flex flex-col items-center gap-3 w-full">
    <h2 class="text-sm uppercase tracking-widest text-gray-400">Number of Players</h2>
    <bm-slider
      [options]="playerCountOptions"
      [value]="playerCount()"
      (valueChange)="playerCount.set($event)"
    />
  </section>

  <!-- Team name fields -->
  <section class="flex flex-col gap-3">
    <h2 class="text-sm uppercase tracking-widest text-gray-400">Player Names</h2>
    <input
      type="text"
      [value]="playerNames()[0]"
      (input)="updatePlayerName(0, $event)"
      class="w-full bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 outline-none"
    />
    <input
      type="text"
      [value]="playerNames()[1]"
      (input)="updatePlayerName(1, $event)"
      class="w-full bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 outline-none"
    />
    @if (playerCount() >= 3) {
      <input
        type="text"
        [value]="playerNames()[2]"
        (input)="updatePlayerName(2, $event)"
        class="w-full bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 outline-none"
      />
    }
    @if (playerCount() >= 4) {
      <input
        type="text"
        [value]="playerNames()[3]"
        (input)="updatePlayerName(3, $event)"
        class="w-full bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 outline-none"
      />
    }
  </section>

  <!-- Start button -->
  <div class="fixed bottom-0 left-0 right-0 p-6 bg-gray-950">
    <button (click)="startGame()" class="w-full bg-white text-gray-950 font-bold text-lg rounded-xl py-4">
      Let's Bone
    </button>
  </div>

</div>
